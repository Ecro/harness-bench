name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      # The boundary and reproduction gates call no model, so CI runs them in full.
      # A reproduction gate that called a model would not be reproducing anything.
      - run: pytest -q
      # The README opens with `bench canary`. Without a console-script entry point that is
      # `command not found` on a fresh install -- the worst possible first impression, and
      # invisible to every other check here.
      - name: entry point is installed and runnable
        run: |
          bench --help > /dev/null
          bench canary --help > /dev/null
      - name: results conform to the published schema
        run: |
          python - <<'PY'
          import json, glob, sys
          schema = json.load(open("results/schema.json"))
          req, props = schema["required"], set(schema["properties"])
          bad = []
          for f in glob.glob("results/*/*.json"):
              d = json.load(open(f))
              bad += [f"{f}: missing {k}" for k in req if k not in d]
              bad += [f"{f}: unknown {k}" for k in d if k not in props]
          print("\n".join(bad) or "all results conform")
          sys.exit(1 if bad else 0)
          PY

  oracle:
    # 오라클이 무엇을 보증하는지 검증한다. 원 연구의 1부는 오라클을 도입하고 이것을
    # 묻지 않았다가 무너졌다 — "빨개짐" 을 "버그 발생" 으로 자동 번역했고, 그 유명한
    # 4/4 회귀는 도달 불가 상태를 고정한 테스트였다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - name: verify task oracles
        run: |
          python - <<'PY'
          import sys
          from harness_bench.experiments.review_convergence.tasks import TASKS
          from harness_bench.experiments.review_convergence import oracle
          ok = all(oracle.verify(t) for t in TASKS.values())
          sys.exit(0 if ok else 1)
          PY

  secrets:
    # runner 는 실행 시 실제 자격증명을 스크래치 HOME 으로 복사한다. 한 번이라도
    # 커밋되면 되돌릴 수 없다. .gitignore + pre-commit 훅에 이어 세 번째 방어선이고,
    # 셋이 같은 스크립트를 쓴다 — 패턴이 갈라지지 않도록.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: ./tools/secret_scan.sh history
